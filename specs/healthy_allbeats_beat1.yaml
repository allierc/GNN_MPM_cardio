general:
  name: fit
  seed: 0
  n_frames: 54
  dt: 0.002
  record_cap: 3
  boundary: wall
  dim: 2
sets:
  tissue:
    n: 1
    start:
    - - 0.5
      - 0.5
    types:
      sheet:
        block:
        - 0.15
        - 0.15
        - 0.85
        - 0.85
        fraction: 1.0
        youngs: 80.0
  cell:
    parent: tissue
    per_parent: 472
    radius: 0.02
    grow_reserve: 0
    types:
      myocyte:
        fraction: 1.0
        youngs: 80.0
  mpm_particle:
    density: 1.0
    parent: cell
    per_parent: 120
    grow_reserve: 0
fields:
  mpm_grid:
    frame: mpm_grid
    n_grid: 128
  cells:
    frame: label_image
    source: ../data/healthy/cells_2560.tif
operators:
- op: seed_from_segmentation
  at: mpm_particle
  from: cells
  youngs_min: 80.0
  youngs_max: 80.0
- op: drag
  at: mpm_particle
  k: 150.0
  emit: mpm_acceleration
- op: anchor_percell
  at: mpm_particle
  k: 10000.0
- op: mpm_strain
  at: mpm_particle
  implementation: differentiable
- op: mpm_scatter
  at: mpm_particle
  to: mpm_grid
  drag: 0.0
  a_max: 200.0
  implementation: differentiable
- op: mpm_grid_update
  at: mpm_grid
  wall_contact: 0.06
  wall_damp: 0.5
  implementation: differentiable
- op: mpm_gather
  at: mpm_particle
  from: mpm_grid
  wall_contact: 0.06
  wall_damp: 0.5
  implementation: differentiable
schedule:
- seed_from_segmentation
- drag
- anchor_percell
- substep_dt: 0.0002
  compile: true
  steps:
  - mpm_strain
  - mpm_scatter
  - mpm_grid_update
  - mpm_gather
plotting: {}
