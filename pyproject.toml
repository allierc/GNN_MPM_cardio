[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plexus-cardio"
version = "0.1.0"
description = "Per-cell active-strain fit of beating cardiomyocyte sheets on the differentiable Plexus material-point engine (healthy and HCM)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy",
    "scipy",
    "pyyaml",
    "tifffile",
]

[project.optional-dependencies]
figures = ["matplotlib"]
segmentation = ["scikit-image"]

[tool.setuptools.packages.find]
where = ["src"]
